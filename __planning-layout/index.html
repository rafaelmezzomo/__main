<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning Semanal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    min-height: 100vh;
  }

  /* Week switcher */
  .week-switcher {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: #010409;
    border-bottom: 1px solid #30363d;
    padding: 0 24px;
    height: 36px;
  }
  .week-tabs-window {
    display: grid;
    grid-template-columns: repeat(5, minmax(150px, 220px));
    align-items: stretch;
    height: 100%;
  }
  .week-tab-slot {
    display: flex;
    justify-content: center;
    align-items: stretch;
  }
  .week-tab {
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 500;
    color: #8b949e;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .week-tab:hover { color: #c9d1d9; }
  .week-tab.active {
    color: #f0f6fc;
    border-bottom-color: #f78166;
  }
  .week-tab .tab-badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: 600;
  }
  .week-tab .tab-badge.current { background: #1f6feb; color: #fff; }
  .week-tab .tab-badge.past { background: #21262d; color: #8b949e; }
  .week-nav {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .week-nav-btn {
    background: none;
    border: 1px solid #30363d;
    color: #8b949e;
    font-size: 14px;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .week-nav-btn:hover { border-color: #58a6ff; color: #c9d1d9; }
  .week-nav-btn:disabled { opacity: 0.3; cursor: default; }

  /* Header */
  .header {
    background: #161b22;
    border-bottom: 1px solid #30363d;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #f0f6fc;
  }
  .header .meta {
    font-size: 13px;
    color: #8b949e;
  }
  .header .meta strong { color: #c9d1d9; }

  /* Retro banner */
  .retro-banner {
    display: none;
    background: linear-gradient(135deg, #161b22 0%, #1c2333 100%);
    border-bottom: 1px solid #30363d;
    padding: 12px 24px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .retro-banner:hover { background: #1c2333; }
  .retro-banner.visible { display: block; }
  .retro-banner-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .retro-banner-title {
    font-weight: 600;
    color: #f0f6fc;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .retro-banner-stats {
    display: flex;
    gap: 16px;
    color: #8b949e;
    font-size: 12px;
  }
  .retro-banner-stats .green { color: #3fb950; }
  .retro-banner-stats .yellow { color: #d29922; }
  .retro-banner-chevron {
    color: #8b949e;
    font-size: 16px;
    transition: transform 0.2s;
  }
  .retro-banner-chevron.expanded { transform: rotate(180deg); }
  .retro-body {
    display: none;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #21262d;
    line-height: 1.6;
    color: #8b949e;
    font-size: 12px;
    max-height: 300px;
    overflow-y: auto;
  }
  .retro-body.expanded { display: block; }
  .retro-body h4 { color: #c9d1d9; margin: 8px 0 4px; font-size: 12px; }
  .retro-body h4:first-child { margin-top: 0; }
  .retro-body ul { padding-left: 16px; }
  .retro-body li { margin-bottom: 2px; }

  /* Stats bar */
  .stats {
    display: flex;
    gap: 24px;
    padding: 12px 24px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    font-size: 13px;
  }
  .stat-item { display: flex; align-items: center; gap: 6px; }
  .stat-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .stat-dot.todo { background: #8b949e; }
  .stat-dot.doing { background: #d29922; }
  .stat-dot.done { background: #3fb950; }

  /* Progress bar */
  .progress-bar {
    height: 3px;
    background: #21262d;
    display: flex;
  }
  .progress-done { background: #3fb950; transition: width 0.3s; }
  .progress-doing { background: #d29922; transition: width 0.3s; }

  /* Board */
  .board {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    height: calc(100vh - 150px);
  }

  .column {
    border-right: 1px solid #30363d;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .column:last-child { border-right: none; }

  .column-header {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid #30363d;
    background: #161b22;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
  }
  .column-header .count {
    background: #30363d;
    color: #8b949e;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
  }

  .column-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  /* Cards */
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 6px;
    cursor: grab;
    transition: border-color 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .card:hover { border-color: #58a6ff; }
  .card.dragging {
    opacity: 0.5;
    border-color: #58a6ff;
    box-shadow: 0 0 0 1px #58a6ff;
  }
  .card-priority {
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    border-radius: 6px 0 0 6px;
  }
  .card-priority.red { background: #f85149; }
  .card-priority.yellow { background: #d29922; }
  .card-priority.green { background: #3fb950; }
  .card-priority.white { background: #8b949e; }

  .card-id {
    font-size: 11px;
    color: #8b949e;
    font-family: 'SF Mono', 'Fira Code', monospace;
    margin-bottom: 4px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 500;
    color: #f0f6fc;
    line-height: 1.4;
    margin-bottom: 8px;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
  }
  .card-project {
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
    font-size: 11px;
  }
  .card-project.mba { background: #16294d; color: #4f8ff7; }
  .card-project.yangplanet { background: #1f3a1f; color: #56d364; }
  .card-project.memory-club { background: #3d2e00; color: #e3b341; }
  .card-project.stalolabs { background: #1c2d4f; color: #79c0ff; }

  .card-hours {
    color: #8b949e;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .card-repo {
    font-size: 10px;
    color: #6e7681;
    margin-top: 4px;
  }

  /* Drop zone */
  .column-body.drag-over { background: rgba(56, 139, 253, 0.04); }

  .priority-icon { margin-right: 4px; }

  /* Filter bar */
  .filters {
    display: flex;
    gap: 6px;
    padding: 8px 24px;
    background: #0d1117;
  }
  .filter-btn {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid #30363d;
    background: transparent;
    color: #8b949e;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: #58a6ff; color: #c9d1d9; }
  .filter-btn.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }

  /* Changelog panel */
  .changelog-btn {
    background: none;
    border: 1px solid #30363d;
    color: #8b949e;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    font-family: inherit;
    line-height: 20px;
  }
  .changelog-btn:hover { border-color: #58a6ff; color: #c9d1d9; }

  .changelog-panel {
    display: none;
    position: fixed;
    top: 0; right: 0;
    width: 480px; height: 100vh;
    background: #161b22;
    border-left: 1px solid #30363d;
    z-index: 90;
    flex-direction: column;
    box-shadow: -8px 0 24px rgba(0,0,0,0.3);
  }
  .changelog-panel.open { display: flex; }

  .changelog-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid #30363d;
  }
  .changelog-header h3 { font-size: 14px; font-weight: 600; color: #f0f6fc; }

  .changelog-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    font-size: 14px;
    line-height: 1.7;
  }
  .changelog-body h2 { font-size: 15px; font-weight: 600; color: #f0f6fc; margin-top: 24px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #21262d; }
  .changelog-body h2:first-child { margin-top: 0; }
  .changelog-body h3 { font-size: 13px; font-weight: 600; color: #c9d1d9; margin-top: 12px; margin-bottom: 4px; }
  .changelog-body ul { padding-left: 18px; margin-bottom: 8px; }
  .changelog-body li { color: #8b949e; font-size: 13px; margin-bottom: 3px; }
  .changelog-body h1 { font-size: 16px; color: #f0f6fc; margin-bottom: 16px; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    justify-content: center;
    align-items: flex-start;
    padding-top: 80px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    width: 560px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 16px 48px rgba(0,0,0,0.4);
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid #30363d;
  }
  .modal-header h2 { font-size: 16px; font-weight: 600; color: #f0f6fc; }
  .modal-close {
    background: none;
    border: none;
    color: #8b949e;
    font-size: 20px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .modal-close:hover { background: #30363d; color: #f0f6fc; }

  .modal-body { padding: 20px; }
  .modal-field { margin-bottom: 16px; }
  .modal-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #8b949e;
    margin-bottom: 4px;
  }
  .modal-value { font-size: 14px; color: #c9d1d9; line-height: 1.5; }
  .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* Formulário de nova tarefa */
  .add-form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .add-field { display: block; }
  .add-field.add-full { grid-column: 1 / -1; }
  .add-field .modal-label { display: block; }
  .add-form input, .add-form select, .add-form textarea {
    width: 100%;
    box-sizing: border-box;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    font: inherit;
    font-size: 14px;
    padding: 8px 10px;
  }
  .add-form textarea { resize: vertical; line-height: 1.5; }
  .add-form input:focus, .add-form select:focus, .add-form textarea:focus {
    outline: none;
    border-color: #1f6feb;
  }
  .add-actions {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 12px;
  }
  .add-submit {
    background: #238636;
    border: 1px solid #2ea043;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    padding: 8px 18px;
  }
  .add-submit:hover { background: #2ea043; }
  .add-submit:disabled { opacity: 0.6; cursor: default; }
  .add-error { color: #ffa198; font-size: 13px; margin-right: auto; }
  @media (max-width: 560px) { .add-form { grid-template-columns: 1fr; } }

  .modal-status-btns { display: flex; gap: 6px; margin-top: 4px; }
  .modal-status-btn {
    padding: 5px 14px;
    border-radius: 6px;
    border: 1px solid #30363d;
    background: transparent;
    color: #8b949e;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .modal-status-btn:hover { border-color: #58a6ff; color: #c9d1d9; }
  .modal-status-btn.active-todo { background: #21262d; border-color: #8b949e; color: #c9d1d9; }
  .modal-status-btn.active-doing { background: #2d2000; border-color: #d29922; color: #d29922; }
  .modal-status-btn.active-done { background: #0d2818; border-color: #3fb950; color: #3fb950; }

  .modal-notes {
    width: 100%;
    min-height: 80px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    font-family: inherit;
    font-size: 13px;
    padding: 10px;
    resize: vertical;
    margin-top: 4px;
  }
  .modal-notes:focus { outline: none; border-color: #58a6ff; }
  .modal-notes::placeholder { color: #484f58; }

  .priority-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 500;
  }
  .priority-badge.red { background: #3d1a1a; color: #f85149; }
  .priority-badge.yellow { background: #3d2e00; color: #d29922; }
  .priority-badge.green { background: #0d2818; color: #3fb950; }
  .priority-badge.white { background: #21262d; color: #8b949e; }
</style>
</head>
<body>

<div class="week-switcher" id="week-switcher"></div>

<div class="header">
  <h1 id="board-title">Planning</h1>
  <div class="meta" style="display:flex;align-items:center;gap:12px">
    <span><span id="date-range"></span> &middot; <strong id="hours-used">0h</strong> / <span id="hours-total">40h</span></span>
    <button class="changelog-btn" id="add-task-toggle">&#43; Nova tarefa</button>
    <a class="changelog-btn" href="/effort/" target="_blank" rel="noopener">&#128200; Dedica&ccedil;&atilde;o</a>
    <button class="changelog-btn" id="retros-toggle">&#128202; Retrospectivas</button>
    <button class="changelog-btn" id="changelog-toggle">&#9776; Changelog</button>
  </div>
</div>

<div class="retro-banner" id="retro-banner">
  <div class="retro-banner-header">
    <div class="retro-banner-title">
      <span>&#128202;</span> <span id="retro-title">Retro</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px">
      <div class="retro-banner-stats" id="retro-stats"></div>
      <span class="retro-banner-chevron" id="retro-chevron">&#9660;</span>
    </div>
  </div>
  <div class="retro-body" id="retro-body"></div>
</div>

<div class="stats" id="stats-bar"></div>
<div class="progress-bar">
  <div class="progress-done" id="progress-done"></div>
  <div class="progress-doing" id="progress-doing"></div>
</div>

<div class="filters" id="filters"></div>

<div class="board">
  <div class="column" data-status="todo">
    <div class="column-header">
      <span>Todo</span>
      <span class="count" id="count-todo">0</span>
    </div>
    <div class="column-body" id="col-todo"></div>
  </div>
  <div class="column" data-status="doing">
    <div class="column-header">
      <span>Doing</span>
      <span class="count" id="count-doing">0</span>
    </div>
    <div class="column-body" id="col-doing"></div>
  </div>
  <div class="column" data-status="done">
    <div class="column-header">
      <span>Done</span>
      <span class="count" id="count-done">0</span>
    </div>
    <div class="column-body" id="col-done"></div>
  </div>
</div>

<div class="changelog-panel" id="changelog-panel">
  <div class="changelog-header">
    <h3>Changelog Diário</h3>
    <button class="modal-close" id="changelog-close">&times;</button>
  </div>
  <div class="changelog-body" id="changelog-body">Carregando...</div>
</div>

<div class="changelog-panel" id="retros-panel">
  <div class="changelog-header">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="week-nav-btn" id="retros-prev">&#9664;</button>
      <button class="week-nav-btn" id="retros-next">&#9654;</button>
      <h3 id="retros-title">Retrospectiva</h3>
    </div>
    <button class="modal-close" id="retros-close">&times;</button>
  </div>
  <div class="changelog-body" id="retros-body">Carregando...</div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="modal-overlay" id="add-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2>Nova tarefa</h2>
      <button class="modal-close" id="add-close">&times;</button>
    </div>
    <div class="modal-body">
      <form id="add-form" class="add-form">
        <label class="add-field add-full">
          <span class="modal-label">T&iacute;tulo</span>
          <input type="text" name="title" required autocomplete="off" placeholder="O que precisa ser feito">
        </label>
        <label class="add-field">
          <span class="modal-label">Projeto</span>
          <select name="project" id="add-project"></select>
        </label>
        <label class="add-field">
          <span class="modal-label">Reposit&oacute;rio</span>
          <input type="text" name="repo" autocomplete="off" placeholder="opcional">
        </label>
        <label class="add-field">
          <span class="modal-label">Prioridade</span>
          <select name="priority">
            <option value="red">&#128308; Fazer Agora</option>
            <option value="yellow" selected>&#128993; Agendar</option>
            <option value="green">&#128994; Quick Win</option>
            <option value="white">&#9898; Backlog</option>
          </select>
        </label>
        <label class="add-field">
          <span class="modal-label">Status</span>
          <select name="status">
            <option value="todo" selected>Todo</option>
            <option value="doing">Doing</option>
            <option value="done">Done</option>
          </select>
        </label>
        <label class="add-field">
          <span class="modal-label">Horas estimadas</span>
          <input type="number" name="estimated_hours" min="0" step="0.5" placeholder="opcional">
        </label>
        <label class="add-field add-full">
          <span class="modal-label">Notas</span>
          <textarea name="notes" rows="4" placeholder="contexto, prazo, depend&ecirc;ncias"></textarea>
        </label>
        <div class="add-actions">
          <span class="add-error" id="add-error"></span>
          <button type="submit" class="add-submit" id="add-submit">Criar tarefa</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
// ── All weeks data ──
const WEEKS = {
  "2026-W22": {
    week: "2026-W22",
    start_date: "2026-05-25",
    end_date: "2026-05-31",
    hours_available: 40,
    retro: {
      completed: true,
      tasks_done: 11,
      tasks_total: 12,
      hours_estimated: 40.5,
      hours_actual: 50,
      what_went_well: "Central de planejamento __main facilitou context switching entre projetos. IDE Mode v0.6.0 saiu do zero em 1 dia. 92% das tasks concluídas.",
      what_blocked: "Faltou alocar tempo para tarefas no-code. Sensação de trava: 3 projetos em andamento mas Clube da Memória é o único com tração real.",
      what_to_change: "Incluir tarefas no-code no planning. Foco em deploy — build para lançar, não para perfeição. Usar Sonnet como modelo padrão."
    },
    projects: {

        { id: "mc-046", title: "Merge train: a main volta a ser a verdade (5 commits, fast-forward)", repo: "memory-club", estimated_hours: 2, priority: "red", notes: "REFINADO em 17/09 com dry-run commit a commit. O merge pra main e FAST-FORWARD e a arvore resultante e BYTE-IDENTICA a da branch (git merge-tree --write-tree main feat/trilhas-zoom-out == git rev-parse feat/trilhas-zoom-out^{tree}). NAO RODAR git revert 2e743d8 — simulado: gera conflito em massa (App.jsx, admin-api, package-lock, ate binario em public/images/games/*.webp) e MATA o fast-forward. O aviso escrito no commit do revert esta obsoleto, foi invalidado pelo back-merge f8a3ec2. NAO E PRA MERGEAR A BRANCH design: o PR #83 (6526b92) que integrou design JA ESTA na historia da trilhas; os 4 commits soltos sao trabalho POSTERIOR e 3 deles foram superados. Fazer cherry-pick seletivo: 108fb06 (botao de voltar, aplica LIMPO) e opcionalmente 386fb85 (calendario, conflito so no CHANGELOG). DESCARTAR e561354, 8bfbcc9 e 34ab5cb — a reescrita do MobileVerticalPath em trilhas mexeu em 358 linhas contra 50 do design, e 34ab5cb traria uma SEGUNDA tela de venda concorrendo com a pagina que o 45b619d criou. Sequencia: cherry-pick -> npm run build -> push -> PR pra develop -> validar no preview -> PR develop->main POR ULTIMO, depois da infra de pe." },
        { id: "mc-047", title: "BLOQUEADOR: course-progress esta fora do IaC e quebra a trilha freemium", repo: "memory-club", estimated_hours: 4, priority: "red", notes: "Achado em 17/09 no levantamento do lancamento — nao estava em nenhum card. As lambdas lambdas/course-progress-get/ e lambdas/course-progress-post/ existem em disco e o FRONT JA AS CONSOME (src/services/apiService.ts:398-403, src/features/course/model/courseProgressSlice.ts, src/components/MobileVerticalPath.jsx:18), mas NAO estao em template.yaml nem no mapa de lambdas/deploy.sh. A tabela e hardcoded sem sufixo (const TABLE = 'course-progress' nos dois index.mjs) e nao e declarada em lugar nenhum. Consequencia: o progresso das aulas da trilha freemium quebra em producao — e a trilha freemium e justamente a isca do lancamento. Escopo: declarar a tabela course-progress${NameSuffix} e as duas lambdas no template.yaml, trocar o TABLE hardcoded por env var, sam build && sam deploy. E o bloqueador numero 1. || ARMADILHA CRITICA DESCOBERTA: samconfig.toml NAO TEM parameter_overrides, e todos os segredos (HotmartHottok, MpAccessToken, MpWebhookSecret, SESSender) tem Default: '' (fail closed). Um sam deploy que esqueca qualquer --parameter-overrides ZERA o SESSender e DERRUBA O LOGIN DE TODO MUNDO, em silencio. ANTES de deployar rodar: aws cloudformation describe-stacks --stack-name memory-club-minigames --region us-east-2 --profile rafaelmezzomo --query 'Stacks[0].Parameters' e guardar os valores (NoEcho mascara os segredos — precisa ter os originais em maos). Detalhes da implementacao: PK userId; eventos GET/POST /course-progress com RestApiId: !Ref MinigameApi (e a unica API do stack; PALACE_API_URL cai em MINIGAME_API_URL por fallback em apiService.ts:9); DynamoDBCrudPolicy; e adicionar os dois dirs em ALL_DIRS de lambdas/deploy.sh:39 e no case do mapa, pra permitir hotfix rapido sem sam deploy no dia." },

const WEEK_ORDER = Object.keys(WEEKS).sort();
let currentWeekKey = WEEK_ORDER[WEEK_ORDER.length - 1]; // default to latest

const PRIORITY_EMOJI = { red: '🔴', yellow: '🟡', green: '🟢', white: '⚪' };
const PRIORITY_LABELS = { red: 'Fazer Agora', yellow: 'Agendar', green: 'Quick Win', white: 'Backlog' };

// ── Sync mode ──
// Servido por scripts/serve.js (http) → status sincroniza com planning.json no disco.
// Aberto via file:// → fallback localStorage (offline, Claude não enxerga).
const SERVER = location.protocol.startsWith('http');

// ── LocalStorage ──
function lsKey(week, type) { return `planning-${type}-${week}`; }

function loadStatuses(week) {
  try { return JSON.parse(localStorage.getItem(lsKey(week, 'status'))) || {}; } catch { return {}; }
}
function saveStatuses(week, statuses) {
  localStorage.setItem(lsKey(week, 'status'), JSON.stringify(statuses));
}

// Lê os status do planning.json no disco (modo server). Retorna {} se falhar.
async function fetchDiskStatuses(week) {
  try {
    const res = await fetch(`/api/planning/${week}`);
    if (!res.ok) return {};
    const json = await res.json();
    const map = {};
    for (const proj of Object.values(json.projects || {})) {
      for (const t of proj.tasks || []) {
        if (t.status && t.status !== 'todo') map[t.id] = t.status;
      }
    }
    return map;
  } catch { return {}; }
}

// Grava um status no disco (modo server). Fire-and-forget com toast no erro.
function pushDiskStatus(week, taskId, status) {
  fetch('/api/status', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ week, taskId, status }),
  }).then(r => { if (!r.ok) showSyncToast('Falha ao salvar no disco'); })
    .catch(() => showSyncToast('Servidor offline — status não salvo'));
}

function showSyncToast(msg) {
  let el = document.getElementById('sync-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'sync-toast';
    el.style.cssText = 'position:fixed;bottom:16px;right:16px;background:#3d1d1d;border:1px solid #f85149;color:#ffa198;padding:8px 14px;border-radius:6px;font-size:13px;z-index:9999;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 3000);
}
function loadNotes(week) {
  try { return JSON.parse(localStorage.getItem(lsKey(week, 'notes'))) || {}; } catch { return {}; }
}
function saveNotes(week, notes) {
  localStorage.setItem(lsKey(week, 'notes'), JSON.stringify(notes));
}

let statuses = {};
let allNotes = {};
let activeFilter = 'all';

function getStatus(taskId) {
  if (statuses[taskId]) return statuses[taskId];
  // Check default_status from data
  const data = WEEKS[currentWeekKey];
  for (const proj of Object.values(data.projects)) {
    for (const t of proj.tasks) {
      if (t.id === taskId && t.default_status) return t.default_status;
    }
  }
  return 'todo';
}

function setStatus(taskId, status) {
  statuses[taskId] = status;
  saveStatuses(currentWeekKey, statuses);
  if (SERVER) pushDiskStatus(currentWeekKey, taskId, status);
}

function getAllTasks() {
  const data = WEEKS[currentWeekKey];
  const tasks = [];
  for (const [projectId, project] of Object.entries(data.projects)) {
    for (const task of project.tasks) {
      tasks.push({ ...task, projectId, projectName: project.name });
    }
  }
  return tasks;
}

// ── Week switcher ──
function renderWeekSwitcher() {
  const el = document.getElementById('week-switcher');
  el.innerHTML = '';

  const idx = WEEK_ORDER.indexOf(currentWeekKey);

  const prevBtn = document.createElement('button');
  prevBtn.className = 'week-nav-btn';
  prevBtn.innerHTML = '&#9664;';
  prevBtn.disabled = idx <= 0;
  prevBtn.addEventListener('click', () => {
    if (idx > 0) switchWeek(WEEK_ORDER[idx - 1]);
  });
  el.appendChild(prevBtn);

  // Janela de 5 slots com a semana selecionada sempre no slot central
  const win = document.createElement('div');
  win.className = 'week-tabs-window';

  for (let offset = -2; offset <= 2; offset++) {
    const slot = document.createElement('div');
    slot.className = 'week-tab-slot';
    const wk = WEEK_ORDER[idx + offset];

    if (wk) {
      const data = WEEKS[wk];
      const isCurrent = offset === 0;
      const isLatest = wk === WEEK_ORDER[WEEK_ORDER.length - 1];

      const tab = document.createElement('div');
      tab.className = `week-tab ${isCurrent ? 'active' : ''}`;

      const startParts = data.start_date.split('-');
      const endParts = data.end_date.split('-');
      const dateLabel = `${startParts[2]}/${startParts[1]} - ${endParts[2]}/${endParts[1]}`;

      let badge = '';
      if (isLatest) {
        badge = '<span class="tab-badge current">atual</span>';
      } else if (data.retro && data.retro.completed) {
        badge = '<span class="tab-badge past">✓</span>';
      }

      tab.innerHTML = `${wk} <span style="color:#6e7681;font-size:11px">${dateLabel}</span> ${badge}`;
      tab.addEventListener('click', () => switchWeek(wk));
      slot.appendChild(tab);
    }

    win.appendChild(slot);
  }
  el.appendChild(win);

  const nextBtn = document.createElement('button');
  nextBtn.className = 'week-nav-btn';
  nextBtn.innerHTML = '&#9654;';
  nextBtn.disabled = idx >= WEEK_ORDER.length - 1;
  nextBtn.addEventListener('click', () => {
    if (idx < WEEK_ORDER.length - 1) switchWeek(WEEK_ORDER[idx + 1]);
  });
  el.appendChild(nextBtn);
}

function switchWeek(weekKey) {
  currentWeekKey = weekKey;
  statuses = loadStatuses(weekKey);
  allNotes = loadNotes(weekKey);
  activeFilter = 'all';
  renderWeekSwitcher();
  renderHeader();
  renderRetro();
  renderFilters();
  render();
  if (typeof isRetroPanelOpen === 'function' && isRetroPanelOpen()) {
    retroIdx = WEEK_ORDER.indexOf(currentWeekKey);
    renderRetroPanel();
  }
  // Modo server: o disco é a fonte de verdade — sobrepõe o status do localStorage.
  if (SERVER) {
    fetchDiskStatuses(weekKey).then(disk => {
      if (weekKey !== currentWeekKey) return;
      statuses = { ...statuses, ...disk };
      saveStatuses(weekKey, statuses);
      render();
    });
  }
}

// ── Header ──
function renderHeader() {
  const data = WEEKS[currentWeekKey];
  document.getElementById('board-title').textContent = `Planning ${data.week}`;
  const startParts = data.start_date.split('-');
  const endParts = data.end_date.split('-');
  document.getElementById('date-range').textContent = `${startParts[2]}/${startParts[1]} - ${endParts[2]}/${endParts[1]}`;
  document.getElementById('hours-total').textContent = `${data.hours_available}h`;
}

function renderRetro() {
  const data = WEEKS[currentWeekKey];

  `;

    <h4>&#9989; O que foi bem</h4>
    <p>${retro.what_went_well}</p>
    <h4>&#9888;&#65039; O que travou</h4>
    <p>${retro.what_blocked}</p>
    <h4>&#128260; O que mudar</h4>

// Retro toggle
let retroExpanded = false;
document.getElementById('retro-banner').addEventListener('click', () => {
  retroExpanded = !retroExpanded;

// ── Cards ──
function createCard(task) {
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.dataset.taskId = task.id;
  card.dataset.project = task.projectId;

  card.innerHTML = `
    <div class="card-priority ${task.priority}"></div>
    <div class="card-id">${PRIORITY_EMOJI[task.priority]} ${task.id}</div>
    <div class="card-title">${task.title}</div>
    <div class="card-footer">
      <span class="card-project ${task.projectId}">${task.projectName}</span>
      <span class="card-hours">${task.estimated_hours == null ? '—' : task.estimated_hours + 'h'}</span>
    </div>
    <div class="card-repo">${task.repo}</div>
  `;

  card.addEventListener('dragstart', e => {
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', task.id);
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));
  card.addEventListener('click', e => {
    if (e.defaultPrevented) return;
    openModal(task);
  });

  return card;
}

// ── Modal ──

  const overlay = document.getElementById('modal-overlay');
  const status = getStatus(task.id);

  document.getElementById('modal-title').textContent = task.title;

  const statusBtnClass = (s) => s !== status ? 'modal-status-btn' : `modal-status-btn active-${s}`;

  document.getElementById('modal-body').innerHTML = `
    <div class="modal-row">
      <div class="modal-field">
        <div class="modal-label">ID</div>
        <div class="modal-value" style="font-family:'SF Mono','Fira Code',monospace">${task.id}</div>

      <div class="modal-field">
        <div class="modal-label">Projeto</div>
        <div class="modal-value"><span class="card-project ${task.projectId}">${task.projectName}</span></div>
      </div>
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <div class="modal-label">Repositório</div>
        <div class="modal-value">${task.repo}</div>
      </div>
      <div class="modal-field">
        <div class="modal-label">Horas Estimadas</div>
        <div class="modal-value">${task.estimated_hours == null ? '—' : task.estimated_hours + 'h'}</div>
      </div>
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <div class="modal-label">Prioridade</div>

      </div>
      <div class="modal-field">
        <div class="modal-label">Status</div>
        <div class="modal-status-btns">
          <button class="${statusBtnClass('todo')}" data-s="todo">Todo</button>
          <button class="${statusBtnClass('doing')}" data-s="doing">Doing</button>
          <button class="${statusBtnClass('done')}" data-s="done">Done</button>
        </div>

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }
document.getElementById('modal-close').addEventListener('click', closeModal);

// ── Render board ──
function render() {
  const tasks = getAllTasks();
  const cols = { todo: [], doing: [], done: [] };

  for (const task of tasks) {
    const status = getStatus(task.id);
    if (activeFilter !== 'all' && task.projectId !== activeFilter) continue;
    cols[status].push(task);
  }

  const priorityOrder = { red: 0, yellow: 1, green: 2, white: 3 };
  for (const col of Object.values(cols)) {
    col.sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);
  }

  for (const [status, statusTasks] of Object.entries(cols)) {
    const colEl = document.getElementById(`col-${status}`);
    colEl.innerHTML = '';
    for (const task of statusTasks) colEl.appendChild(createCard(task));
    document.getElementById(`count-${status}`).textContent = statusTasks.length;
  }

  updateStats(tasks);
}

addForm.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('add-submit');
  const f = addForm.elements;
  const payload = {
    week: currentWeekKey,
    project: f.project.value,
    title: f.title.value,
    repo: f.repo.value,
    priority: f.priority.value,
    status: f.status.value,
    estimated_hours: f.estimated_hours.value,
    notes: f.notes.value,
  };

  btn.disabled = true;
  addError.textContent = '';
  try {
    const res = await fetch('/api/task', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'falha ao criar');

    // Injeta na memória pra o card aparecer sem reload; o disco já foi gravado.
    const task = json.task;
    WEEKS[currentWeekKey].projects[payload.project].tasks.push({
      id: task.id,
      title: task.title,
      repo: task.repo,
      estimated_hours: task.estimated_hours,
      priority: task.priority,
      notes: task.notes,
      default_status: task.status,
    });
    statuses[task.id] = task.status;

    closeAddModal();
    render();
    renderHeader();
  } catch (err) {
    addError.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

function updateStats(allTasks) {
  const filtered = activeFilter === 'all' ? allTasks : allTasks.filter(t => t.projectId === activeFilter);
  const total = filtered.length;
  const doing = filtered.filter(t => getStatus(t.id) === 'doing').length;
  const done = filtered.filter(t => getStatus(t.id) === 'done').length;
  const todo = total - doing - done;

  const hoursDone = filtered.filter(t => getStatus(t.id) === 'done').reduce((s, t) => s + (t.estimated_hours || 0), 0);
  const hoursDoing = filtered.filter(t => getStatus(t.id) === 'doing').reduce((s, t) => s + (t.estimated_hours || 0), 0);
  const hoursTotal = filtered.reduce((s, t) => s + (t.estimated_hours || 0), 0);

  document.getElementById('hours-used').textContent = `${hoursDone + hoursDoing}h`;

  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-item"><div class="stat-dot todo"></div> ${todo} todo</div>
    <div class="stat-item"><div class="stat-dot doing"></div> ${doing} doing</div>
    <div class="stat-item"><div class="stat-dot done"></div> ${done} done</div>
    <div class="stat-item" style="margin-left:auto;color:#8b949e">${hoursDone}h done / ${hoursTotal}h total</div>
  `;

  const pctDone = total > 0 ? (done / total) * 100 : 0;
  const pctDoing = total > 0 ? (doing / total) * 100 : 0;
  document.getElementById('progress-done').style.width = pctDone + '%';
  document.getElementById('progress-doing').style.width = pctDoing + '%';
}

  const data = WEEKS[currentWeekKey];

  const projects = [{ id: 'all', name: 'Todos' }, ...Object.entries(data.projects).map(([id, p]) => ({ id, name: p.name }))];

}

function parseMarkdown(md) {
  return md
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs, m => '<ul>' + m + '</ul>')
    .replace(/<\/ul>\s*<ul>/g, '')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code style="background:#21262d;padding:2px 5px;border-radius:3px;font-size:12px">$1</code>')
    .replace(/\n{2,}/g, '<br>');
}

## Reflexão

### O que foi bem
O lançamento saiu no prazo e inteiro. Não foi "subir o pagamento e arrumar depois": o gate
server-side, o gate duro de UI, o OTP de posse de email e a ordenação de eventos do webhook entraram
como tarefas de primeira classe, antes do vídeo. O sandbox e2e isolado foi a decisão que sustentou
isso — validar o ciclo completo, inclusive chargeback, sem risco nenhum pras 79 compras reais, e
transformar o resultado em quatro tickets fechados na mesma semana. E ainda sobrou velocidade: em
cima do lançamento saíram o login próprio sem senha, o funil de aquisição do RAM, o Memory Pulse e a
release v1.4.

### O que travou
Duas coisas, e são a mesma. **Yang Planet e Stalo Labs pararam** — zero commits em sete dias. A
atenção inteira foi pro Clube, o que fazia sentido numa semana de lançamento, mas as duas frentes
ficaram sem nenhum avanço e o Yang só voltou a se mexer no dia 17.

E **o planning descolou da execução**. O board dizia 24h e 12 tarefas; o git dizia 83 commits e ~59h.
Quatro entregas grandes do Clube e a única atividade real do Stalo nunca viraram card. Sem essa
reconciliação, a retro teria contado uma semana que não aconteceu — e pior, teria concluído que o
sprint rendeu pouco, quando ele rendeu 148% do budget.

### O que mudar
**Registrar o que nasce no meio.** Trabalho não planejado que come o sprint entra no \`planning.json\`
no mesmo dia, com horas, mesmo que a decisão de fazer tenha sido tomada na hora. Não é burocracia:
é o que separa "o Clube consumiu tudo" de "o Clube consumiu tudo *e olha o que saiu*". Enquanto o
board não registra, a retro vira arqueologia de git e as decisões de priorização da semana seguinte
são tomadas em cima de um número errado.

## Reflexão

### O que foi bem

**O sprint entregou continuamente.** Três versões foram para a main em dois dias — v1.5.1, v1.5.2,
v1.5.3 — além da landing nova e dos três minigames. Nada ficou esperando outra coisa para subir.

Isso merece ser dito com todas as letras porque é o **contraste exato com a W36**: mesmo
desenvolvedor, mesmo código, mesma velocidade de commit (79 commits aqui, 88 lá). A W35 colocou tudo
no ar e a W36 não colocou nada. A diferença não foi esforço nem competência — foi que na W35 cada
entrega saía de uma base já mergeada, e na W36 cada uma começou a partir da anterior ainda em
branch.

O outro acerto foi de método: **diagnosticar por escrito antes de corrigir**. Os documentos \`#95\` e
\`#96\` transformaram "a interface está ruim" numa lista numerada de defeitos, e cada commit fechou um
item específico. É o oposto de polir no olho, e foi o que permitiu tocar seis jogos sem regressão.

### O que travou

**O experimento das três landings nunca produziu um resultado.** As variantes A, B e C foram
construídas, a C mudou o funil de propósito (aula grátis em vez de compra direta), e o beta estava
registrado em \`Plannings/#97\`. Só que na W36 o redesign substituiu aqueles CTAs — a revisão de tech
lead registrou isso em \`#109\`, item 5: *"variante C morreu"*, com um pedido para confirmar se a
mudança de funil era intencional. **Até hoje ninguém confirmou.**

Ou seja: construiu-se três versões de uma página para escolher a melhor, e a escolha nunca foi
feita — a decisão foi tomada por acidente, pelo sprint seguinte. O trabalho não foi perdido, mas o
aprendizado foi.

**Metade do Clube não fechou.** 7 de 14, e algumas das que ficaram abertas são as mesmas de hoje.
O \`mc-036\` (fundação de rotas públicas) começou aqui o seu ciclo de **três sprints seguidos em
vermelho sem ser feito** — o que, na prática, é o board dizendo que ele nunca foi urgente. O
\`mc-037\` (separação de reputação de e-mail) também nasceu aqui e segue parado, com o \`template.yaml\`
editado e nada deployado.

**O board já estava descolando da execução.** O \`sl-016\` (login com Clerk) aparece como aberto neste
sprint, mas o trabalho foi feito em **28/08 — o último dia da janela**. Ele só foi registrado como
concluído no sprint seguinte, virando \`sl-017\`. É o mesmo diagnóstico que a retro da W33 já tinha
feito, repetido: o que é entregue no fim do sprint não vira registro, e a retro seguinte tem que ir
buscar no git.

### O que mudar

**Experimento precisa de data de decisão e de métrica, não só de variantes.** Três landings sem um
critério escrito de quem ganha e quando se decide não é um teste — é três páginas. Se não há volume
para decidir, o registro tem que dizer isso e o experimento tem que ser adiado, não construído.

**Tarefa entregue no último dia entra no board no último dia.** A v0.4 do MOAI foi um sprint inteiro
de trabalho que atravessou a fronteira sem registro. Isso não é burocracia: é o que separa "a Stalo
entregou pouco" de "a Stalo entregou a v0.4 inteira".

**Vermelho que sobrevive a dois sprints deixa de ser vermelho.** O \`mc-036\` provou na prática que
não era urgente. Ou ele vira quick win e sai numa tarde, ou desce para amarelo e para de ocupar o

## Highlights por projeto

### Yang Planet — o sprint que funcionou
7 de 7 tarefas fechadas. Rastreabilidade dos fundos com proveniência e lifecycle, re-verificação dos
51 fundos com evidência datada, badges de status no frontend, o fix do teto de 400KB do Dynamo que

Três trials ao vivo foram conduzidos. **Nenhum seguiu no funil, e não há registro do motivo de
nenhum deles** — virou pendência vermelha na W37 (\`yp-039\`).

### Stalo Labs — uma entrega, no primeiro dia
A v0.4 do MOAI saiu em 28/08, no dia seguinte ao planning que a criou: login individual com Clerk,
allowlist, passwordless, trilha de auditoria com "editado por", ata geral em PDF. Fechou o \`sl-016\`
e resolveu a rastreabilidade que o termo de LGPD exigia. Depois disso a Stalo ficou parada o sprint
inteiro — **1 commit em duas semanas**.

### Clube da Memória — 88 commits, zero em produção
O que foi construído: checkout próprio no Mercado Pago com Brick, carteira e reembolso self-service
na garantia de 7 dias; aulas tocando no app via Mux com \`/curso\` virando hub de trilhas e trilha
freemium de 2 aulas grátis; redesign interno com o Victor (design system, layout desktop,
superfícies de conversão Pro); mapa de trilhas na home; app iOS com Capacitor.

Foi ao ar: o Memory Pulse em \`pulse.memoria.club\`, a sessão persistente com claim atômico do RAM, o
onboarding do Fuji e o polimento dos minigames.

**A última coisa que entrou na main foi em 08/09** (\`5cc7927\`, fix de sessão). Tudo o mais continua
em branch.

---

## Reflexão

### O que foi bem

O Yang provou que o método funciona quando o trabalho é fatiado em entregas que fecham sozinhas.
Sete tarefas, sete merges, nenhuma dependendo da outra — e no meio delas um bug de produção real
(o teto de 400KB) foi achado, corrigido e fechado dentro do mesmo sprint.

No Clube, a qualidade do que foi construído não está em questão. O checkout tem reembolso
self-service com fluxo de dois e-mails e header de contingência do Pix; a trilha freemium tem
progresso persistido; o redesign passou por revisão de tech lead que registrou 12 débitos por
escrito em vez de deixar passar. Isso é trabalho bem feito.

### O que travou — e o mecanismo exato

Três entregas ficaram amarradas uma na outra, e o git mostra **como** isso aconteceu. As branches
não eram frentes paralelas: eram uma **pilha**.

\`\`\`
develop (design system / v1.6.0)
 └─ feat/checkout-mercado-pago     nasceu de develop
     └─ adeus-hotmart              nasceu do checkout
         └─ feat/trilhas-zoom-out  nasceu do adeus-hotmart
\`\`\`

Cada feature nova começou **a partir da anterior ainda não mergeada**. A consequência é aritmética,
não opinião: para colocar o mapa de trilhas no ar, era obrigatório levar junto o Mux, o Mercado Pago
e o design system inteiro. Não existia caminho para entregar um sem os outros três. A landing e o
redesign ficaram presos ao fluxo de Mux/Mercado Pago não porque alguém decidiu acoplar, mas porque
foram construídos empilhados.

**O dia 08/09 foi a fatura dessa dívida chegando.** O PR #82 era para levar só o fix de sessão
(#112). Como a main estava atrás da develop desde a 1.6.0, o merge arrastou 317 arquivos junto — um
release inteiro não planejado, no meio da semana. Foi revertido no mesmo dia. A partir dali a main
congelou.

Ou seja: **na única vez em que se tentou entregar algo pequeno, o sprint acumulado veio junto e
forçou um rollback.** É o sintoma clássico de branch de vida longa, e custou o lançamento da W36.

Três consequências que só apareceram quando alguém foi olhar, em 17/09:
- as lambdas \`course-progress\` **nunca foram declaradas no \`template.yaml\`** — o front já as consome,
  então a trilha freemium quebraria em produção no primeiro clique;
- os playback IDs do Mux são os **públicos de teste**, e o gate do Pro é client-side — o curso de
  R$499 fica legível no bundle;
- o checkout **nunca rodou com dinheiro real**.

Nenhuma das três estava em card nenhum. Todas são filhas do mesmo problema: **código que não vai a
produção não é testado por ninguém**.

### O que mudar

**Uma branch, um merge, um sprint.** Nenhuma feature nova começa a partir de uma branch não
mergeada. Se precisar do que está na anterior, a anterior entra na main primeiro — mesmo incompleta,
atrás de flag. A regra não é estética: é o que impede que a quarta feature sequestre as três
primeiras.

**A main não pode ficar mais de uma semana atrás da develop.** O incidente do #82 não foi erro de
merge, foi consequência de distância acumulada. Se \`develop → main\` tivesse rodado em 03/09, o PR
#82 teria sido o que se esperava dele: um fix de sessão.

**Infra entra no \`template.yaml\` no mesmo commit que cria a lambda.** As \`course-progress\` passaram
duas semanas existindo em disco, sendo chamadas pelo front, sem nunca existir no IaC. Isso não é
descuido de quem escreveu — é a ausência de um passo obrigatório.

**Registrar prazo de terceiro como card, não como lembrança.** A liberação de 30 dias do Mercado
Pago e o DNS do SES têm relógio externo e nenhum dos dois tinha card. Descobrir isso na véspera do
lançamento é o mesmo padrão do caso Tainara: o problema só aparece quando alguém vai olhar.

let retroIdx = WEEK_ORDER.indexOf(currentWeekKey);

function renderRetroPanel() {
  const key = WEEK_ORDER[retroIdx];
  document.getElementById('retros-title').textContent = `Retro ${key}`;
  const md = RETROS_MD[key];
  document.getElementById('retros-body').innerHTML = md
    ? parseMarkdown(md)
    : `<p style="color:#8b949e">Retro ainda não disponível para <strong>${key}</strong>.</p>`;
  document.getElementById('retros-prev').disabled = retroIdx === 0;
  document.getElementById('retros-next').disabled = retroIdx === WEEK_ORDER.length - 1;
}

function isRetroPanelOpen() {
  return document.getElementById('retros-panel').classList.contains('open');
}

document.getElementById('retros-toggle').addEventListener('click', () => {
  const panel = document.getElementById('retros-panel');
  if (panel.classList.contains('open')) {
    panel.classList.remove('open');
  } else {
    document.getElementById('changelog-panel').classList.remove('open');
    panel.classList.add('open');
    retroIdx = WEEK_ORDER.indexOf(currentWeekKey);
    renderRetroPanel();
  }
});
document.getElementById('retros-close').addEventListener('click', () => {
  document.getElementById('retros-panel').classList.remove('open');
});
document.getElementById('retros-prev').addEventListener('click', () => {
  if (retroIdx > 0) { retroIdx--; renderRetroPanel(); }
});
document.getElementById('retros-next').addEventListener('click', () => {
  if (retroIdx < WEEK_ORDER.length - 1) { retroIdx++; renderRetroPanel(); }
});

}
